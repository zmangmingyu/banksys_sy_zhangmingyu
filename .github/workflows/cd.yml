name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync code to server
        uses: easingthemes/ssh-deploy@v5.1.0
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc --delete"
          SOURCE: ""
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          TARGET: /opt/banksys
          EXCLUDE: ".git, __pycache__, .pytest_cache, .vscode, .idea, models, data"

      - name: Build and deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            APP="banksys"
            PORT="8888"
            PORT_MAX="8900"
            DEPLOY_DIR="/opt/${APP}"
            cd "${DEPLOY_DIR}"

            docker build \
              --build-arg PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple \
              -t ${APP}:latest .

            # 端口检测与自动回退
            port_in_use() {
              ss -ltnH 2>/dev/null | grep -q ":$1 " && return 0
              docker ps --format "{{.Ports}}" 2>/dev/null | grep -q ":$1->" && return 0
              return 1
            }

            HOST_PORT=""
            for p in $(seq ${PORT} ${PORT_MAX}); do
              if ! port_in_use "$p"; then HOST_PORT="$p"; break; fi
            done
            [ -z "${HOST_PORT}" ] && { echo "预留端口区间已全部占用,部署中止"; exit 1; }
            echo ">> 部署到主机端口 ${HOST_PORT}"

            # 幂等替换旧容器
            docker rm -f ${APP} 2>/dev/null || true
            docker run -d \
              --name ${APP} \
              --restart unless-stopped \
              -p ${HOST_PORT}:8888 \
              ${APP}:latest

            sleep 3
            curl -fsS "http://localhost:${HOST_PORT}/_stcore/health"
            echo ">> 部署成功: http://$(hostname -I | awk '{print $1}'):${HOST_PORT}"
